  <section class="panel" aria-labelledby="t-ins">
    <h2 id="t-ins">Chapas, fita e ferragens em estoque</h2>
    <p class="hint">O plano compara com o que você tem e mostra o que falta comprar. Ao atualizar o estoque, o gasto é descontado. Chapas inteiras entram no "Tenho" da lista de compras quando material, espessura e tamanho batem com a chapa do plano.</p>
    <div id="insList" style="margin-top:8px"></div>
    <div class="grid" style="margin-top:12px">
      <div class="field"><label for="insTipo">Tipo</label><select id="insTipo"><option value="fita">Fita de borda (metros)</option><option value="ferr">Ferragem (unidades)</option><option value="chapa">Chapa inteira de MDF (unidades)</option></select></div>
      <div class="field" style="grid-column: span 2"><label for="insNome">Nome (igual ao usado no plano)</label><input id="insNome" placeholder="Ex.: Fita branca 22mm"></div>
      <div class="field"><label for="insQ">Quantidade</label><input id="insQ" inputmode="decimal"></div>
    </div>
    <div class="grid" id="insChapa" hidden style="margin-top:12px">
      <div class="field"><label for="insEsp">Espessura (mm)</label><input id="insEsp" list="dlEsp" inputmode="decimal" value="15"></div>
      <div class="field"><label for="insC" id="insCl">Comprimento</label><input id="insC" inputmode="decimal"></div>
      <div class="field"><label for="insL" id="insLl">Largura</label><input id="insL" inputmode="decimal"></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="btnIns" class="primary" type="button">Guardar no estoque</button><span id="insMsg" class="hint"></span></div>
  </section>
