# Publica o Plano de Corte MDF no GitHub Pages a cada push na main.
# Testa, compila e entrega o arquivo único como index.html.
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  publicar:
    # versão fixa: o ubuntu-latest muda para o Ubuntu 26 em 19/10/2026; trocar quando quiser, testando antes
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Compilar
        run: npm run build
      - name: Montar a pasta do site
        run: |
          mkdir _site
          cp dist/plano-corte-mdf.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      # nome com o número da tentativa: "Re-run" não encontra dois artefatos com o mesmo nome
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
